name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Make scripts executable
        run: chmod +x scripts/*.sh app/*.sh tests/*.sh

      - name: Run lint
        run: ./scripts/lint.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Make scripts executable
        run: chmod +x app/*.sh tests/*.sh

      - name: Run test suite
        run: ./tests/test.sh

  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Make scripts executable
        run: chmod +x scripts/*.sh app/*.sh

      - name: Build image and run smoke tests
        run: ./scripts/build.sh
